site_name: Knowledge Refinery
site_description: Central development knowledge for Codex with optional Git history
site_url: https://skanehira1126.github.io/knowledge-refinery/
repo_url: https://github.com/skanehira1126/knowledge-refinery
repo_name: skanehira1126/knowledge-refinery
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Shinichi Kanehira
theme:
  name: material
  language: ja
  icon:
    logo: material/filter-variant
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替える
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替える
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
extra_javascript:
  - javascripts/mermaid.mjs
nav:
  - ホーム: index.md
  - はじめる:
      - インストールと初期設定: getting-started.md
      - 利用モードと依頼例: agent-workflow.md
      - AGENTS.mdの設定例: agents-guidance-examples.md
  - 基本概念:
      - ナレッジモデルと検索: knowledge-model.md
      - アーキテクチャ: architecture.md
  - 運用ガイド:
      - 新しいチャットへの引き継ぎ: handoffs.md
      - repoの有効化・無効化: project-lifecycle.md
      - ナレッジの保守: knowledge-operations.md
      - Gitとバックアップ: git-operations.md
      - トラブルシューティング: troubleshooting.md
  - リファレンス:
      - CLI: cli.md
      - MCP tools: mcp.md
      - YAML schema: schema.md
      - Skills: skills/README.md
      - refinery-project: skills/refinery-project.md
      - refinery-experience: skills/refinery-experience.md
      - refinery-memory: skills/refinery-memory.md
      - refinery-maintenance: skills/refinery-maintenance.md
      - refinery-handoff: skills/refinery-handoff.md
  - コントリビューション:
      - 開発・リリース: development.md
